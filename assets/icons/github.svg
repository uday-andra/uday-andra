<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="githubGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE">
        <animate attributeName="stop-color"
                 values="#22D3EE;#7C3AED;#10B981;#22D3EE"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color"
                 values="#7C3AED;#10B981;#22D3EE;#7C3AED"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28"
          fill="none"
          stroke="url(#githubGradient)"
          stroke-width="2"
          filter="url(#glow)">
    <animate attributeName="r"
             values="28;29;28"
             dur="3s"
             repeatCount="indefinite"/>
  </circle>

  <path fill="url(#githubGradient)"
        filter="url(#glow)"
        d="M32 10C19.8 10 10 19.8 10 32c0 9.8 6.3 18.1 15.1 21.1 1.1.2 1.5-.5 1.5-1.1v-4.1c-6.1 1.3-7.4-2.6-7.4-2.6-1-2.5-2.5-3.2-2.5-3.2-2-.9.2-.9.2-.9 2.2.2 3.4 2.3 3.4 2.3 2 3.3 5.2 2.4 6.5 1.8.2-1.4.8-2.4 1.4-3-4.9-.6-10.1-2.4-10.1-10.8 0-2.4.9-4.4 2.3-6-.2-.6-1-2.8.2-5.9 0 0 1.9-.6 6.1 2.3a20.6 20.6 0 0 1 11.2 0c4.2-2.9 6.1-2.3 6.1-2.3 1.2 3.1.4 5.3.2 5.9 1.5 1.6 2.3 3.6 2.3 6 0 8.4-5.2 10.2-10.2 10.8.8.7 1.5 2.1 1.5 4.2v6.2c0 .6.4 1.3 1.5 1.1A22.1 22.1 0 0 0 54 32C54 19.8 44.2 10 32 10z"/>
</svg>