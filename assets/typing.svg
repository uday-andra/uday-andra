<svg
    xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="80"
    viewBox="0 0 900 80">

<style>

text{
    font-family:'JetBrains Mono','Fira Code',monospace;
    font-size:34px;
    font-weight:700;
    fill:#22d3ee;
}

.cursor{
    fill:#22d3ee;
    animation:blink 1s infinite;
}

@keyframes blink{
0%,50%{opacity:1;}
51%,100%{opacity:0;}
}

</style>

<rect
width="900"
height="80"
rx="18"
fill="#0f172a"/>

<text x="40" y="50">

Java Full Stack Developer

<animate
attributeName="opacity"
values="0;1;1;0"
dur="3s"
repeatCount="indefinite"/>

</text>

<text x="40" y="50"
opacity="0">

React Developer

<animate
attributeName="opacity"
values="0;0;1;1;0"
dur="6s"
repeatCount="indefinite"/>

</text>

<text x="40" y="50"
opacity="0">

Spring Boot Developer

<animate
attributeName="opacity"
values="0;0;0;1;1;0"
dur="9s"
repeatCount="indefinite"/>

</text>

<text x="40" y="50"
opacity="0">

Cybersecurity Enthusiast

<animate
attributeName="opacity"
values="0;0;0;0;1;1;0"
dur="12s"
repeatCount="indefinite"/>

</text>

<text x="40" y="50"
opacity="0">

Open Source Contributor

<animate
attributeName="opacity"
values="0;0;0;0;0;1;1;0"
dur="15s"
repeatCount="indefinite"/>

</text>

<text x="40" y="50"
opacity="0">

AI Explorer

<animate
attributeName="opacity"
values="0;0;0;0;0;0;1;1;0"
dur="18s"
repeatCount="indefinite"/>

</text>

<rect
class="cursor"
x="610"
y="24"
width="8"
height="34"/>

</svg>